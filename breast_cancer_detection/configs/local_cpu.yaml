environment:
  name: local_cpu
  device: cpu

optimization:
  n_initial: 1
  n_iterations: 1
  candidates_per_iteration: 1
  resume_from_csv: false

training:
  max_epochs: 2
  patience: 1
  batch_size: 1
  num_workers: 0

smoke_test:
  enabled: true
  max_train_breasts: 5
  max_val_breasts: 3
  max_inbreast_calibration_images: 2



paths:
  project_root: "."

  vindr_images: "data/vindr/vindr_mammo_dataset_dave/images"
  vindr_csv: "data/vindr/vindr_mammo_dataset_dave/metadata/stratified_selection.csv" 

  inbreast_dicom_dir: "data/inbreast/INbreast_Release/AllDICOMs" 
  inbreast_metadata: "data/inbreast/INbreast.xls"

  csv_resume_path: ""
  inbreast_split_info_path: ""

  output_dir: "results/botorch_mobo"